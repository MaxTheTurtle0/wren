name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: format, lint, docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - name: Tests (unit, Graph against a mock server, headless UI)
        run: cargo test --locked --workspace --all-targets
      - name: macOS window smoke test
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          CODESIGN_IDENTITY: '-'
        run: |
          cargo build --locked --release
          packaging/macos/bundle.sh target/release/wren "$RUNNER_TEMP/Wren.app" 0.1.0
          open -W -n "$RUNNER_TEMP/Wren.app" --args --screenshot "$RUNNER_TEMP/wren-demo.png" --page chats --size 1280x800 --screenshot-delay 3000
          test -s "$RUNNER_TEMP/wren-demo.png"
      - name: macOS screenshot
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-screenshot
          path: ${{ runner.temp }}/wren-demo.png

  signing:
    name: macOS signing identity regression
    runs-on: macos-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - run: packaging/macos/test-signing.sh

  package:
    name: package (${{ matrix.name }})
    # Builds installable artifacts on main; nothing is published as a release.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [quality, test, signing]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Package macOS app
        if: runner.os == 'macOS'
        # Disposable development artifact, not an update release.
        env:
          CODESIGN_IDENTITY: '-'
        run: |
          mkdir -p dist
          packaging/macos/bundle.sh target/release/wren dist/Wren.app "$(cargo pkgid | sed 's/.*[#@]//')"
          ditto -c -k --keepParent dist/Wren.app dist/wren-${{ matrix.name }}.zip
      - name: Build the relay (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release -p wren-relay
          mkdir -p dist
          tar -C target/release -czf dist/wren-relay-${{ matrix.name }}.tar.gz wren-relay
      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/wren
          cp target/release/wren packaging/linux/wren.desktop packaging/linux/wren-256.png packaging/linux/install.sh packaging/icons/wren.svg LICENSE THIRD-PARTY-NOTICES.md dist/wren/
          tar -C dist -czf dist/wren-${{ matrix.name }}.tar.gz wren
      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/wren | Out-Null
          Copy-Item target/release/wren.exe, LICENSE, THIRD-PARTY-NOTICES.md dist/wren/
          Compress-Archive -Path dist/wren/* -DestinationPath dist/wren-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: wren-${{ matrix.name }}
          path: |
            dist/wren-${{ matrix.name }}.*
            dist/wren-relay-${{ matrix.name }}.*
          retention-days: 14
