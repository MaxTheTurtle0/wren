name: Check license notices
description: Verify the committed dependency and font notices with the pinned generator.
runs:
  using: composite
  steps:
    - name: Install cargo-about 0.9.2
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        curl --fail --silent --show-error --location https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz --output cargo-about.tar.gz
        echo '9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  cargo-about.tar.gz' | sha256sum --check
        tar -xzf cargo-about.tar.gz
        echo "$RUNNER_TEMP/cargo-about-0.9.2-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
    - name: Check dependency and bundled font notices
      shell: bash
      run: packaging/generate-notices.sh --check
