[package]
name = "wren"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A fast, native Microsoft Teams client built with Rust and egui"
repository = "https://github.com/MaxTheTurtle0/wren"
keywords = ["teams", "microsoft-graph", "chat", "egui", "messaging"]
categories = ["gui"]
default-run = "wren"

[workspace]
members = [".", "relay"]

[lib]
name = "wren"
path = "src/lib.rs"

[[bin]]
name = "wren"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
directories = "6"
jiff = "0.2"

# The whole interface. glow keeps the binary and dependency tree small; wgpu
# is not needed for a 2D messaging client. AccessKit connects egui's widgets
# to the platform's screen readers.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.36"
# SVG icons and decoded avatars/inline images.
egui_extras = { version = "0.36", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
# Rasterizes the SVG logo for the window, tray and dock icons. Already
# compiled for egui_extras' SVG support, so it adds no code to the build.
resvg = { version = "0.45", default-features = false }

# Shared foundation of the crmne egui apps (github.com/crmne/fastframe): the
# same tag ZapFast builds with. Every crate comes from the same revision.
# Interface font (the platform's own, Inter where there is none) and installed
# fonts for other scripts.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Follows the desktop's hinting and glyph coverage.
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# The icons! table, a loader that survives reduce_texture_memory, Lucide icons.
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Colour emoji in the platform's own style, drawn off the interface thread.
fastframe-emoji = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Palette files and the shared presets (Catppuccin, Nord, Tokyo Night, ...).
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Logs to stderr and a per-run file, records panics without their payload.
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Tray item: StatusNotifier on Linux, notification area on Windows, menu bar
# on macOS.
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Keeps Wren running (sync, notifications) with the window closed.
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Centres the macOS traffic lights on Wren's own header.
fastframe-macos = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# One running copy per user; a second launch hands its request over.
fastframe-instance = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }
# Platform-like wheel step and Linux touchpad glide.
fastframe-scroll = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1" }

# Network and background work. The runtime lives on its own thread
# (src/backend.rs); the interface never awaits.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs"] }
# Microsoft Graph and the Entra ID token endpoint. rustls everywhere so every
# platform links one TLS stack and builds without OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2"] }
# PKCE: a random verifier, its SHA-256 challenge, base64url without padding.
sha2 = "0.11"
base64 = "0.22"
getrandom = "0.4"
urlencoding = "2"
# Local cache of chats, messages, teams and channels, with FTS5 search.
# Bundled so every platform gets the same SQLite with FTS5.
rusqlite = { version = "0.40", features = ["bundled"] }
# Opens the system browser for sign-in and for meeting/call hand-off.
open = "5"
# Native desktop notifications: D-Bus on Linux, the notification centre on
# macOS, toast notifications on Windows.
notify-rust = { version = "4", default-features = false, features = ["z"] }
# Unicode grapheme handling for avatars' initials and text truncation.
unicode-segmentation = "1"
# The push relay's WebSocket (src/realtime.rs, experimental). The same
# version axum uses in wren-relay, over the rustls stack reqwest already
# links.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# One protected-store API, with only each target's native provider below.
# Refresh tokens never go into ordinary state files.
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

# The icon and version information Windows shows for the executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
# The relay itself, for the end-to-end push test.
wren-relay = { path = "relay" }
# A local HTTP server standing in for Graph and the token endpoint, so the
# client's paging, throttling and refresh behaviour is tested without the
# network.
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }

[features]
default = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Immediate-mode layout and image decoding are too slow at opt-level 0 to
# develop against. Keep dependencies optimized; the app crate stays
# incremental.
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# crmne/egui apps-0.36 and crmne/winit apps-0.30, shared with Spotifast,
# ZapFast, RekordFlash and TonePush: egui 0.36.1 with egui's busy-loop fix
# (emilk/egui#8398, idle CPU), Wayland frame pacing by compositor callbacks
# (emilk/egui#8631), a compatibility-profile GL fallback for old Windows
# drivers (emilk/egui#8655), and window size persistence at any zoom
# (emilk/egui#8656). Every egui crate comes from the same revision so they
# share one emath and epaint; move egui and winit together. Drop these once
# upstream releases carry the fixes. See fastframe's README for the table.
ecolor = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
eframe = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
emath = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
winit = { git = "https://github.com/crmne/winit", rev = "ed7caa9023f10b397f5b6ec8284a840cbd8a6f65" }
