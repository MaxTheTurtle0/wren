# One notice set for the desktop client and relay on every packaged target.
# Build dependencies are included; test-only dependencies are not shipped.
accepted = [
    "MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib",
    "Unicode-3.0", "CC0-1.0", "Unlicense", "BSL-1.0", "MPL-2.0",
    "OpenSSL", "OFL-1.1", "Ubuntu-font-1.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
workarounds = ["ring", "rustls"]

# These crates omit their license files or need explicit file selection.
# Hashes bind each clarification to the upstream text; do not replace them
# with generic SPDX texts, which discard copyright notices.

